; BIMA admin-api Alembic config.
;
; The actual DATABASE_URL is read from env in alembic/env.py — `sqlalchemy.url`
; below is a placeholder so Alembic doesn't refuse to start with an empty
; config. NEVER put a real password here.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder

; Sort generated revisions newest-first in the directory.
file_template = %%(rev)s_%%(slug)s

; -----------------------------------------------------------------------------
; Logging
; -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
