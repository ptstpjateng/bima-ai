# Rate limiting zones (defined outside the server block)
# Webhook: 30 req/min per IP — generous for Telegram/WhatsApp deliveries
limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=30r/m;
# API: 120 req/min per IP — matches Laravel throttle:120,1
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=120r/m;

server {
    listen 80;
    server_name _;

    # Allow file uploads up to 350 MB (matches PHP post_max_size)
    client_max_body_size 350M;

    # Use Docker's internal DNS so container IPs are re-resolved after restarts.
    resolver 127.0.0.11 valid=15s ipv6=off;

    # AI Engine webhooks (Telegram/WhatsApp — future HTTPS use)
    location /webhook/ {
        limit_req zone=webhook_limit burst=10 nodelay;
        limit_req_status 429;

        set $ai_upstream http://ai-engine:8000;
        proxy_pass         $ai_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Laravel static assets (Filament CSS/JS/fonts in public/)
    location ~ ^/(css|js|fonts)/ {
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Laravel backend — API + Sanctum + Filament admin
    location ~ ^/(api|sanctum|admin|livewire)(/|$) {
        limit_req zone=api_limit burst=30 nodelay;
        limit_req_status 429;

        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_connect_timeout 60s;
        proxy_buffering       off;
    }

    # Everything else → backend (Filament root redirect, health, etc.)
    location / {
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
