server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so container IPs are re-resolved after restarts.
    resolver 127.0.0.11 valid=15s ipv6=off;

    # AI Engine webhooks (Telegram/WhatsApp — future HTTPS use)
    location /webhook/ {
        set $ai_upstream http://ai-engine:8000;
        proxy_pass         $ai_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Laravel static assets (Filament CSS/JS/fonts in public/)
    location ~ ^/(css|js|fonts)/ {
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Laravel backend — API + Sanctum + Filament admin
    location ~ ^/(api|sanctum|admin|livewire)(/|$) {
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # Everything else → backend (Filament root redirect, health, etc.)
    location / {
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
