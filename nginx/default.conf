server {
    listen 80;
    server_name _;

    # Use Docker's internal DNS so container IPs are re-resolved after restarts.
    resolver 127.0.0.11 valid=15s ipv6=off;

    # AI Engine webhooks (Telegram/WhatsApp — future HTTPS use)
    location /webhook/ {
        set $ai_upstream http://ai-engine:8000;
        proxy_pass         $ai_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Laravel backend — API + Sanctum + Filament admin
    location ~ ^/(api|sanctum|admin|livewire)/ {
        set $backend_upstream http://backend:80;
        proxy_pass         $backend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }

    # Next.js frontend — everything else
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass         $frontend_upstream;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
