services:

  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bima_ai}
      POSTGRES_USER: ${DB_USERNAME:-bima}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bima-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bima} -d ${DB_DATABASE:-bima_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bima-internal
    healthcheck:
      # `| grep -q PONG` is load-bearing, not style. redis-cli exits 0 on an
      # ERROR REPLY and only exits non-zero when the connection itself fails —
      # verified on this exact image: against a requirepass'd server, bare
      # `redis-cli ping` prints "NOAUTH Authentication required." and still
      # exits 0. So the bare check only proves the PORT IS OPEN, and reports
      # healthy while redis rejects every command. ai-engine, admin-api and
      # backend all gate on `redis: condition: service_healthy`, so a lie here
      # is a lie the whole stack trusts. Matching the reply makes it mean what
      # it claims: redis is actually serving commands.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # AI Engine (FastAPI + ChromaDB)
  # ──────────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    # Generous memory cap (VPS has 27G) — a safety net against a torch/embedder
    # leak OOM-killing peers, far above the ~350M steady-state usage.
    mem_limit: 4g
    env_file: ./ai-engine/.env
    environment:
      - CHROMA_HOST=${CHROMA_HOST:-ai-engine}
    # Redis is used for durable chat sessions (services/session_store.py) when
    # BIMA_REDIS_SESSIONS_ENABLED=true. ai-engine degrades to in-memory if it's
    # down, but start redis first so the durable store is reachable on boot.
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - bima-internal
      - bima-public
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # Data Pipeline (Playwright scraper — run on demand)
  # ──────────────────────────────────────────────
  data-pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile
    # Was `restart: "no"` → the service died permanently on any crash or VPS
    # reboot, silently 502-ing the "Sync ke ChromaDB" flow. It's idempotent and
    # only acts when triggered, so auto-recover is safe.
    restart: unless-stopped
    # Cap a runaway Playwright/Chromium scrape (generous; VPS has 27G).
    mem_limit: 4g
    env_file: ./data-pipeline/.env
    volumes:
      - ./data-pipeline/data:/app/data
      - backend_storage:/app/backend_storage:ro  # read-only access to backend uploads
      # Sprint C: ingestion-upload volume. admin-api writes here as
      # /app/uploads (rw); data-pipeline reads via /app/data/uploads.
      - ingestion_uploads:/app/data/uploads:ro
      # Shared with ai-engine. ETL writes ChromaDB chunks here; ai-engine
      # reads them via the same volume. chromadb 0.6.3 uses SQLite WAL by
      # default, so concurrent writer + readers across containers are safe.
      - chroma_data:/app/chroma_db
    networks:
      - bima-internal
    depends_on:
      ai-engine:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Admin API (FastAPI + SQLAlchemy — replaces Laravel admin)
  # Sprint B foundation; resource endpoints land in Phase 2.
  # ──────────────────────────────────────────────
  admin-api:
    build:
      context: ./admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./admin-api/.env
    environment:
      # NOTE: DATABASE_URL deliberately NOT overridden here — env_file owns it.
      # The compose-side `${DB_PASSWORD:-secret}` substitution doesn't URL-encode
      # special chars (the actual password contains @), which breaks asyncpg.
      # admin-api/.env contains a properly-encoded URL.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
      # admin-api's TrustedHostMiddleware derives allowed hosts from this list.
      # Include nolongin.com so requests proxied via Caddy (Host: nolongin.com)
      # are accepted, in addition to admin.nolongin.com (the Vercel host). The
      # bimaptsp.com pair is pre-allowed for the planned domain migration
      # (currently DNS-sinkholed, so harmless until it resolves). This mirrors
      # the manual edit that had drifted onto the VPS — now committed so deploys
      # that touch this file no longer abort on the local change.
      ADMIN_FRONTEND_URL: https://admin.nolongin.com,https://nolongin.com,https://admin.bimaptsp.com,https://bimaptsp.com
      LOG_LEVEL: INFO
      # Sprint C ingestion-upload: tell admin-api where data-pipeline lives
      # so /ingestion/upload can trigger /pipeline/etl-excel on the internal
      # bima-internal network.
      DATA_PIPELINE_URL: http://data-pipeline:9000
    volumes:
      # rw mount of the shared ingestion volume; data-pipeline reads the
      # same volume read-only under /app/data/uploads.
      - ingestion_uploads:/app/uploads
    networks:
      - bima-internal
      - bima-public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # Reverse Proxy (Caddy — auto Let's Encrypt for nolongin.com)
  # Replaces nginx; legacy config kept at nginx/default.conf for rollback.
  # Custom build adds the caddy-ratelimit plugin (see ./caddy/Dockerfile).
  # ──────────────────────────────────────────────
  proxy:
    build:
      context: ./caddy
    image: bima-caddy:ratelimit
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - bima-public
    # Wait for upstreams to be HEALTHY (not merely started) so Caddy doesn't
    # accept :443 and 502 the first webhook/admin requests during boot.
    depends_on:
      backend:
        condition: service_healthy
      ai-engine:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # TALL Backend (Laravel 13 + FrankenPHP)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend-tall
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend-tall/.env
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bima_ai}
      DB_USERNAME: ${DB_USERNAME:-bima}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_ENGINE_URL: http://ai-engine:8000
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      FRONTEND_URL: ${FRONTEND_URL:-http://116.254.113.81}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
    ports:
      - "8000:80"
    volumes:
      - backend_storage:/var/www/html/storage/app
    networks:
      - bima-internal
      - bima-public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"file_get_contents('http://localhost:80/up');\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Laravel queue worker (shares the same image)
  queue:
    build:
      context: ./backend-tall
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend-tall/.env
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bima_ai}
      DB_USERNAME: ${DB_USERNAME:-bima}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_ENGINE_URL: http://ai-engine:8000
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--timeout=90"]
    # This worker shares the backend image, whose Dockerfile HEALTHCHECK probes
    # the FrankenPHP admin port (2019). A queue:work worker serves no HTTP, so
    # that check ALWAYS fails → a permanent false "unhealthy". Disable it; the
    # container exits if the worker dies and `restart: unless-stopped` recovers.
    healthcheck:
      disable: true
    volumes:
      - backend_storage:/var/www/html/storage/app
    networks:
      - bima-internal
    depends_on:
      backend:
        condition: service_healthy


  # Beta-SIAP Jateng — staging clone of DPMPTSP licensing system at
  # beta-siap.nolongin.com. Used by BIMA for end-to-end integration testing
  # (validator + officer copilot + portal SSO + WA status fast-path) without
  # touching real production SIAP. PII risk explicitly accepted by user on
  # 2026-05-19. Built from FrankenPHP image mirroring backend-tall pattern.
  siap-beta:
    build:
      context: /home/wdnsds/siap
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: /home/wdnsds/siap/.env
    environment:
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - siap_beta_storage:/var/www/html/storage/app
    networks:
      - bima-internal
      - bima-public
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/admin/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  # Internal: backend ↔ ai-engine ↔ postgres ↔ redis ↔ queue
  bima-internal:
    driver: bridge

  # Public-facing: frontend ↔ backend (only these two expose ports to host)
  bima-public:
    driver: bridge

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  chroma_data:
  backend_storage:
  caddy_data:
  caddy_config:
  # Sprint C ingestion-upload: shared between admin-api (rw, /app/uploads)
  # and data-pipeline (ro, /app/data/uploads). Admins drop XLSX files via
  # the /data page; data-pipeline reads them by absolute path.
  ingestion_uploads:
  # Beta-SIAP Laravel storage/app dir (PII uploads from the dump\'s ptsp.files refs)
  siap_beta_storage:
