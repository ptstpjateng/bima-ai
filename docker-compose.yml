services:

  # ──────────────────────────────────────────────
  # Infrastructure
  # ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-bima_ai}
      POSTGRES_USER: ${DB_USERNAME:-bima}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bima-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-bima} -d ${DB_DATABASE:-bima_ai}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - bima-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  # AI Engine (FastAPI + ChromaDB)
  # ──────────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./ai-engine/.env
    environment:
      - CHROMA_HOST=${CHROMA_HOST:-ai-engine}
    volumes:
      - chroma_data:/app/chroma_db
    networks:
      - bima-internal
      - bima-public
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # Data Pipeline (Playwright scraper — run on demand)
  # ──────────────────────────────────────────────
  data-pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile
    restart: "no"
    env_file: ./data-pipeline/.env
    volumes:
      - ./data-pipeline/data:/app/data
      - backend_storage:/app/backend_storage:ro  # read-only access to backend uploads
      # Sprint C: ingestion-upload volume. admin-api writes here as
      # /app/uploads (rw); data-pipeline reads via /app/data/uploads.
      - ingestion_uploads:/app/data/uploads:ro
      # Shared with ai-engine. ETL writes ChromaDB chunks here; ai-engine
      # reads them via the same volume. chromadb 0.6.3 uses SQLite WAL by
      # default, so concurrent writer + readers across containers are safe.
      - chroma_data:/app/chroma_db
    networks:
      - bima-internal
    depends_on:
      ai-engine:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Admin API (FastAPI + SQLAlchemy — replaces Laravel admin)
  # Sprint B foundation; resource endpoints land in Phase 2.
  # ──────────────────────────────────────────────
  admin-api:
    build:
      context: ./admin-api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./admin-api/.env
    environment:
      # NOTE: DATABASE_URL deliberately NOT overridden here — env_file owns it.
      # The compose-side `${DB_PASSWORD:-secret}` substitution doesn't URL-encode
      # special chars (the actual password contains @), which breaks asyncpg.
      # admin-api/.env contains a properly-encoded URL.
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
      # admin-api's TrustedHostMiddleware derives allowed hosts from this list.
      # Include nolongin.com so requests proxied via Caddy (Host: nolongin.com)
      # are accepted, in addition to admin.nolongin.com (the eventual Vercel host).
      ADMIN_FRONTEND_URL: https://admin.nolongin.com,https://nolongin.com
      LOG_LEVEL: INFO
      # Sprint C ingestion-upload: tell admin-api where data-pipeline lives
      # so /ingestion/upload can trigger /pipeline/etl-excel on the internal
      # bima-internal network.
      DATA_PIPELINE_URL: http://data-pipeline:9000
    volumes:
      # rw mount of the shared ingestion volume; data-pipeline reads the
      # same volume read-only under /app/data/uploads.
      - ingestion_uploads:/app/uploads
    networks:
      - bima-internal
      - bima-public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3

  # ──────────────────────────────────────────────
  # Reverse Proxy (Caddy — auto Let's Encrypt for nolongin.com)
  # Replaces nginx; legacy config kept at nginx/default.conf for rollback.
  # ──────────────────────────────────────────────
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    networks:
      - bima-public
    depends_on:
      - backend
      - ai-engine

  # ──────────────────────────────────────────────
  # TALL Backend (Laravel 13 + FrankenPHP)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend-tall
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend-tall/.env
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bima_ai}
      DB_USERNAME: ${DB_USERNAME:-bima}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_ENGINE_URL: http://ai-engine:8000
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      CACHE_STORE: redis
      FRONTEND_URL: ${FRONTEND_URL:-http://116.254.113.81}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-change-me-in-production}
    ports:
      - "8000:80"
    volumes:
      - backend_storage:/var/www/html/storage/app
    networks:
      - bima-internal
      - bima-public
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai-engine:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r \"file_get_contents('http://localhost:80/up');\" || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5

  # Laravel queue worker (shares the same image)
  queue:
    build:
      context: ./backend-tall
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ./backend-tall/.env
    environment:
      APP_ENV: production
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-bima_ai}
      DB_USERNAME: ${DB_USERNAME:-bima}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_ENGINE_URL: http://ai-engine:8000
      QUEUE_CONNECTION: redis
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600", "--timeout=90"]
    volumes:
      - backend_storage:/var/www/html/storage/app
    networks:
      - bima-internal
    depends_on:
      backend:
        condition: service_healthy


# ──────────────────────────────────────────────
# Networks
# ──────────────────────────────────────────────
networks:
  # Internal: backend ↔ ai-engine ↔ postgres ↔ redis ↔ queue
  bima-internal:
    driver: bridge

  # Public-facing: frontend ↔ backend (only these two expose ports to host)
  bima-public:
    driver: bridge

# ──────────────────────────────────────────────
# Volumes
# ──────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  chroma_data:
  backend_storage:
  caddy_data:
  caddy_config:
  # Sprint C ingestion-upload: shared between admin-api (rw, /app/uploads)
  # and data-pipeline (ro, /app/data/uploads). Admins drop XLSX files via
  # the /data page; data-pipeline reads them by absolute path.
  ingestion_uploads:
